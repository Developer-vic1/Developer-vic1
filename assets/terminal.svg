<svg xmlns="http://www.w3.org/2000/svg" width="550" height="270" viewBox="0 0 550 270" role="img" aria-labelledby="title">
  <title id="title">Terminal de desarrollo animada</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121A38"/><stop offset="1" stop-color="#080E20"/></linearGradient>
    <clipPath id="inner"><rect x="22" y="52" width="510" height="192" rx="4"/></clipPath>
  </defs>
  <rect x="1" y="1" width="548" height="268" rx="15" fill="url(#bg)" stroke="#334B7B" stroke-width="2"/>
  <path d="M15 1H535Q549 1 549 16V39H1V16Q1 1 15 1Z" fill="#202B4E"/>
  <circle cx="22" cy="20" r="6" fill="#FF6B8B"/><circle cx="43" cy="20" r="6" fill="#F5C464"/><circle cx="64" cy="20" r="6" fill="#4ADE80"/>
  <text x="275" y="25" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#9FB9DF">victor@developer: ~/workspace</text>
  <g font-family="Consolas,DejaVu Sans Mono,monospace" font-size="15" clip-path="url(#inner)">
