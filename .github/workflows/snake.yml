name: Serpiente de contribuciones

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/snake.yml
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Crear imagenes de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Developer-vic1
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%230EA5E9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322D3EE
      - name: Publicar los archivos SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
